      <section id="screen-placeholder" class="app-view" aria-labelledby="placeholder-title">
        
        <div class="screen-top-bar" style="width:100%;">
          <button class="btn-top-back" onclick="GrihamRouter.goBack()" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span data-i18n="nav_back">Back</span>
          </button>
          <span class="top-bar-brand-badge">Griham</span>
        </div>

        <div class="placeholder-container">
          
          <div id="placeholder-badge" class="placeholder-badge">
            <span id="placeholder-badge-text">Portal</span>
          </div>

          <div id="placeholder-icon-box" class="placeholder-icon-wrap icon-resident">
            <!-- Icon injected by router -->
          </div>

          <h2 class="placeholder-title" id="placeholder-title">Placeholder Screen</h2>
          <p class="placeholder-desc" id="placeholder-desc">This screen is a functional placeholder for navigation testing.</p>

          <!-- Society Authentication Schema Preview -->
          <div class="society-auth-notice">
            <strong>Society-Aware Auth Schema:</strong>
            <code>{ society_id, phone, password }</code>
            <div style="margin-top: 0.3rem; opacity: 0.75;" id="placeholder-endpoint-info">Target: POST /api/v1/auth/login</div>
          </div>

          <button class="btn-back-nav" onclick="GrihamRouter.navigate('/')" id="btn-back-home" aria-label="Return to Entry Screen">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
            </svg>
            <span data-i18n="btn_back_home">Back to Home</span>
          </button>

        </div>
      </section>
